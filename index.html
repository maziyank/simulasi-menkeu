<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menkeu RI — 5 Tahun Membantu Presiden</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #141a2e;
    --bg3: #1c2440;
    --line: #2a3458;
    --text: #e8ecf5;
    --muted: #8a93ad;
    --gold: #ffc857;
    --green: #4ade80;
    --red: #f87171;
    --warn: #fbbf24;
    --blue: #60a5fa;
    --pres: #c084fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    padding: 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  #app { min-height: 100vh; }

  /* ---------- INTRO ---------- */
  .intro { text-align: center; padding: 40px 24px; max-width: 680px; margin: 0 auto; }
  .intro h1 { color: var(--gold); font-size: 30px; letter-spacing: 1px; margin-bottom: 6px; }
  .intro .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .crest-big { font-size: 56px; margin-bottom: 10px; }

  /* ---------- DISCLAIMER ---------- */
  .disclaimer-box {
    background: linear-gradient(135deg, rgba(255,193,7,0.08), rgba(220,53,69,0.05));
    border: 1px solid var(--warn);
    border-left: 4px solid var(--warn);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 14px 0 22px;
    text-align: left;
  }
  .disclaimer-title { font-weight: 700; color: var(--warn); font-size: 13px; margin-bottom: 6px; letter-spacing: 0.3px; }
  .disclaimer-body { color: var(--muted); font-size: 12.5px; line-height: 1.65; }
  .disclaimer-body b { color: var(--text); }

  /* ---------- CTA ---------- */
  .cta {
    display: inline-block; background: var(--gold); color: #1a1300;
    font-weight: 700; font-size: 16px; padding: 13px 32px;
    border: none; border-radius: 10px; cursor: pointer;
    letter-spacing: 0.5px; transition: transform 0.1s, opacity 0.2s;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ---------- HUD ---------- */
  .hud {
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
    position: sticky; top: 8px; z-index: 10;
  }
  .hud-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }
  .hud-year { font-size: 15px; font-weight: 700; color: var(--pres); }
  .hud-q-count { font-size: 12px; color: var(--muted); }
  .hud-progress { height: 6px; background: var(--bg3); border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
  .hud-progress > div {
    height: 100%; background: linear-gradient(90deg, var(--gold), var(--green));
    transition: width 0.4s ease; border-radius: 3px;
  }
  .hud-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px 8px; }
  .stat {
    display: flex; flex-direction: column; background: var(--bg3);
    border-radius: 7px; padding: 6px 8px; border: 1px solid transparent;
    transition: border-color 0.3s, background 0.3s;
  }
  .stat .lbl { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat .val { font-size: 13px; font-weight: 700; }
  .stat.good { border-color: rgba(74,222,128,0.4); }
  .stat.bad { border-color: rgba(248,113,113,0.4); }
  .stat .val.good { color: var(--green); }
  .stat .val.bad { color: var(--red); }
  .stat.flash { animation: flash 0.6s ease; }
  @keyframes flash {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); background: #2a3556; }
    100% { transform: scale(1); }
  }

  /* ---------- TARGETS PANEL ---------- */
  .targets-panel {
    background: var(--bg2); border: 1px solid var(--line);
    border-left: 3px solid var(--pres);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 14px;
  }
  .targets-title { font-size: 12px; color: var(--pres); font-weight: 700; margin-bottom: 8px; letter-spacing: 0.3px; }
  .targets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 10px; }
  .target {
    display: flex; flex-direction: column; gap: 2px;
    font-size: 11.5px; padding: 4px 0;
  }
  .target .t-lbl { color: var(--muted); }
  .target .t-row { display: flex; align-items: center; gap: 6px; }
  .target .t-current { font-weight: 700; color: var(--text); font-size: 12.5px; }
  .target .t-target { color: var(--muted); font-size: 11px; }
  .target .t-check { font-size: 14px; }
  .target.met .t-check { color: var(--green); }
  .target.miss .t-check { color: var(--red); }

  /* ---------- YEAR INTRO ---------- */
  .year-intro {
    text-align: center; padding: 32px 24px;
    animation: slideIn 0.5s ease;
  }
  .year-intro .yr-num { font-size: 14px; color: var(--pres); font-weight: 700; letter-spacing: 2px; margin-bottom: 6px; }
  .year-intro h1 { font-size: 28px; color: var(--gold); margin-bottom: 6px; }
  .year-intro .yr-tagline { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .president-msg {
    background: var(--bg2); border: 1px solid var(--line);
    border-left: 4px solid var(--pres); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px; text-align: left;
    max-width: 620px; margin-left: auto; margin-right: auto;
  }
  .president-msg .who { font-size: 12px; color: var(--pres); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
  .president-msg .msg { font-size: 14px; color: var(--text); line-height: 1.6; font-style: italic; }

  .year-targets-card {
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px;
    max-width: 620px; margin: 0 auto 20px; text-align: left;
  }
  .year-targets-card h3 { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
  .year-targets-card .yt-row {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
  }
  .year-targets-card .yt-row:last-child { border-bottom: none; }
  .year-targets-card .yt-row .yt-k { color: var(--muted); }
  .year-targets-card .yt-row .yt-v { font-weight: 700; color: var(--gold); }

  /* ---------- QUESTION ---------- */
  .q-card {
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px 20px; animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .q-num { color: var(--gold); font-size: 11.5px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
  .q-tag { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .q-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.35; }
  .q-desc { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; line-height: 1.6; }

  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    background: var(--bg3); border: 1px solid var(--line);
    border-left: 3px solid transparent; border-radius: 9px;
    padding: 10px 14px; cursor: pointer; text-align: left;
    color: var(--text); font-size: 13.5px; font-family: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.08s; width: 100%;
  }
  .choice:hover:not(:disabled) { border-left-color: var(--gold); background: #243056; }
  .choice:active:not(:disabled) { transform: scale(0.99); }
  .choice:disabled { cursor: default; opacity: 0.85; }
  .choice .lbl { display: block; font-weight: 600; margin-bottom: 3px; }
  .choice .hint { font-size: 11.5px; color: var(--muted); }

  .choice.picked-pos { border-left-color: var(--green); background: rgba(74,222,128,0.08); }
  .choice.picked-neg { border-left-color: var(--red); background: rgba(248,113,113,0.08); }
  .choice.picked-neutral { border-left-color: var(--blue); background: rgba(96,165,250,0.08); }

  .feedback {
    margin-top: 14px; padding: 11px 14px; border-radius: 9px;
    font-size: 13px; animation: slideIn 0.3s ease;
  }
  .feedback.pos { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--green); }
  .feedback.neg { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
  .feedback.info { background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.3); color: var(--blue); }
  .feedback .fx-list { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .feedback .fx-list .pos { color: var(--green); }
  .feedback .fx-list .neg { color: var(--red); }
  .feedback .next-hint { margin-top: 8px; font-size: 11px; color: var(--muted); font-style: italic; }

  /* ---------- YEAR REVIEW ---------- */
  .review { padding: 28px 22px; max-width: 680px; margin: 0 auto; animation: slideIn 0.4s ease; }
  .review h1 { color: var(--gold); font-size: 24px; text-align: center; margin-bottom: 4px; }
  .review .sub { color: var(--muted); font-size: 13.5px; text-align: center; margin-bottom: 18px; }

  .review-card {
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .review-card h3 { color: var(--pres); font-size: 13.5px; margin-bottom: 10px; }
  .review-card .t-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
  }
  .review-card .t-row:last-child { border-bottom: none; }
  .review-card .t-row .t-k { color: var(--muted); }
  .review-card .t-row .t-v { display: flex; align-items: center; gap: 6px; }
  .review-card .t-row .t-v .now { font-weight: 700; }
  .review-card .t-row .t-v .now.met { color: var(--green); }
  .review-card .t-row .t-v .now.miss { color: var(--red); }
  .review-card .t-row .t-v .req { color: var(--muted); font-size: 11.5px; }
  .review-card .t-row .badge { font-size: 14px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
  .review-card .t-row .badge.met { background: rgba(74,222,128,0.15); color: var(--green); }
  .review-card .t-row .badge.miss { background: rgba(248,113,113,0.15); color: var(--red); }

  .president-reaction {
    background: var(--bg2); border: 1px solid var(--line);
    border-left: 4px solid var(--pres); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; text-align: left;
  }
  .president-reaction .who { font-size: 12px; color: var(--pres); font-weight: 700; margin-bottom: 6px; }
  .president-reaction .msg { font-size: 13.5px; color: var(--text); line-height: 1.6; font-style: italic; }

  /* ---------- GAME OVER / VICTORY ---------- */
  .ending { padding: 28px 22px; max-width: 680px; margin: 0 auto; }
  .ending h1 { color: var(--gold); font-size: 26px; text-align: center; margin-bottom: 6px; }
  .verdict-big {
    font-size: 26px; font-weight: 800; text-align: center;
    padding: 16px; border-radius: 12px; margin: 14px 0;
  }
  .verdict-big.legendary { background: linear-gradient(135deg, rgba(255,200,87,0.18), rgba(74,222,128,0.1)); color: var(--gold); border: 1px solid var(--gold); }
  .verdict-big.strong { background: rgba(74,222,128,0.1); color: var(--green); border: 1px solid var(--green); }
  .verdict-big.decent { background: rgba(96,165,250,0.08); color: var(--blue); border: 1px solid var(--blue); }
  .verdict-big.weak { background: rgba(248,113,113,0.08); color: var(--red); border: 1px solid var(--red); }
  .verdict-label { text-align: center; color: var(--muted); font-size: 13.5px; margin-bottom: 16px; line-height: 1.55; }

  .score-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .score-num { font-size: 38px; font-weight: 800; color: var(--gold); }
  .score-max { font-size: 18px; color: var(--muted); }

  .final-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }
  .final-stats .stat .val { font-size: 14px; }

  .summary {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .summary h3 { color: var(--gold); font-size: 13.5px; margin-bottom: 8px; }
  .summary .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .summary .row:last-child { border-bottom: none; }
  .summary .row .k { color: var(--muted); }
  .summary .row .v { font-weight: 600; }
  .summary .row .v.pos { color: var(--green); }
  .summary .row .v.neg { color: var(--red); }

  .cta-center { text-align: center; margin-top: 18px; }

  @media (max-width: 560px) {
    .intro h1 { font-size: 24px; }
    .q-title { font-size: 16px; }
    .hud-stats { grid-template-columns: repeat(3, 1fr); }
    .stat .val { font-size: 12px; }
    .stat .lbl { font-size: 9px; }
    .targets-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ============================================================
   MENKEU RI — 5 Tahun Membantu Presiden
   Game fiksi. Tokoh, angka, dan kejadian di sini rekaan.
   Tujuan: edukasi dinamika keputusan fiskal & dukungan
   kepada presiden selama satu periode jabatan (5 tahun).
   ============================================================ */

const DISCLAIMER = `
  <div class="disclaimer-box">
    <div class="disclaimer-title">📢 Disclaimer</div>
    <div class="disclaimer-body">
      Game ini <b>100% fiksi</b> dan dibuat <b>hanya untuk hiburan dan tujuan edukasi</b>. Semua tokoh, lembaga, kasus, angka, dan kejadian di sini adalah <b>rekaan</b>. Kemiripan dengan kenyataan adalah kebetulan belaka.
      <br><br>
      Game ini <b>bukan opini politik</b>, bukan ramalan, dan <b>bukan saran kebijakan</b>. Tujuannya membantu pemain merasakan dinamika pengambilan keputusan fiskal sebagai pembantu presiden.
    </div>
  </div>
`;

const STAT_META = [
  { key: "kas",        ico: "💵", lbl: "Kas",        fmt: v => "Rp " + Math.round(v).toLocaleString("id-ID") + " T" },
  { key: "ekonomi",    ico: "📈", lbl: "Ekonomi",    fmt: v => v.toFixed(0) },
  { key: "inflasi",    ico: "🍞", lbl: "Inflasi",    fmt: v => (v/6).toFixed(1) + "%" },
  { key: "rakyat",     ico: "🙂", lbl: "Rakyat",     fmt: v => v.toFixed(0) },
  { key: "presiden",   ico: "👔", lbl: "Presiden",   fmt: v => v.toFixed(0) },
  { key: "pasar",      ico: "🏦", lbl: "Pasar",      fmt: v => v.toFixed(0) },
  { key: "integritas", ico: "🧼", lbl: "Integritas", fmt: v => v.toFixed(0) },
];
const STAT_KEYS = STAT_META.map(s => s.key);

/* ---------- YEAR CONFIG: 5 tahun, tiap tahun ada target presiden ---------- */
const YEARS = [
  {
    year: 1, tagline: "Tahun Pertama — Pembersihan & Stabilisasi",
    presMsg: "\"Pak/Bu Menkeu, ekonomi masih rapuh. Tolong stabilkan dulu tahun ini. Jaga inflasi jangan sampai rakyat tambah menderita, dan bangun kepercayaan pasar. Saya percayakan ini ke Anda.\"",
    targets: [
      { key: "inflasi",   op: "<=", req: 24, label: "Inflasi ≤ 4.0%" },
      { key: "pasar",     op: ">=", req: 60, label: "Pasar ≥ 60" },
      { key: "presiden",  op: ">=", req: 55, label: "Kepercayaan Presiden ≥ 55" },
    ],
  },
  {
    year: 2, tagline: "Tahun Kedua — Penerimaan & Reformasi Pajak",
    presMsg: "\"Penerimaan pajak kita masih lemah. Saya butuh reformasi. Naikkan rasio penerimaan tanpa mati-matian matikan rakyat. Jaga kas tetap sehat — saya ingin mulai bangun infrastruktur tahun depan.\"",
    targets: [
      { key: "kas",       op: ">=", req: 450, label: "Kas ≥ Rp 450 T" },
      { key: "ekonomi",   op: ">=", req: 55,  label: "Ekonomi ≥ 55" },
      { key: "integritas",op: ">=", req: 55,  label: "Integritas ≥ 55" },
    ],
  },
  {
    year: 3, tagline: "Tahun Ketiga — Pembangunan & Investasi",
    presMsg: "\"Saya ingin dorong pertumbuhan keras-keras tahun ini — ini tahun tengah, saya butuh capaian nyata untuk rakyat. Tapi awas, jangan sampai defisit jebol. Pasar dan rakyat harus sama-sama percaya.\"",
    targets: [
      { key: "ekonomi",   op: ">=", req: 60, label: "Ekonomi ≥ 60" },
      { key: "rakyat",    op: ">=", req: 55, label: "Rakyat ≥ 55" },
      { key: "pasar",     op: ">=", req: 55, label: "Pasar ≥ 55" },
    ],
  },
  {
    year: 4, tagline: "Tahun Keempat — Disiplin Fiskal Menjelang Pilpres",
    presMsg: "\"Tahun depan pilpres. Saya butuh gambaran ekonomi rapi: inflasi terkendali, kas aman, rakyat senang. Tolong jangan bikin skandal. Pertahankan kepercayaan saya — itu paling penting.\"",
    targets: [
      { key: "inflasi",   op: "<=", req: 24, label: "Inflasi ≤ 4.0%" },
      { key: "rakyat",    op: ">=", req: 60, label: "Rakyat ≥ 60" },
      { key: "presiden",  op: ">=", req: 60, label: "Kepercayaan Presiden ≥ 60" },
    ],
  },
  {
    year: 5, tagline: "Tahun Kelima — Penutupan & Warisan",
    presMsg: "\"Tahun terakhir. Saya ingin tutup jabatan dengan warisan yang bersih. Kas sehat, integritas terjaga, pertumbuhan solid. Tolong pastikan semuanya aman sampai akhir. Jangan ada kejutan buruk.\"",
    targets: [
      { key: "kas",       op: ">=", req: 500, label: "Kas ≥ Rp 500 T" },
      { key: "ekonomi",   op: ">=", req: 60,  label: "Ekonomi ≥ 60" },
      { key: "integritas",op: ">=", req: 60,  label: "Integritas ≥ 60" },
      { key: "presiden",  op: ">=", req: 60,  label: "Presiden ≥ 60" },
    ],
  },
];

/* ---------- QUESTIONS: 4 pertanyaan per tahun × 5 tahun = 20 ---------- */
const QUESTIONS = [
  // ============ TAHUN 1 — STABILISASI MAKROEKONOMI ============
  { year: 1, id: "y1q1", title: "Penanganan Defisit APBN di Atas Batas Maksimum",
    desc: "Realisasi defisit APBN tahun berjalan diproyeksikan mencapai 3,42% PDB, melampaui batas maksimum 3,0% PDB sebagaimana diamanatkan Undang-Undang Keuangan Negara. Agensi pemeringkat internasional (S&P, Moody's, Fitch) menerbitkan peringatan outlook negatif dengan potensi penurunan rating sovereign dari BBB ke BBB-. Guna memitigasi risiko tersebut, Pemerintah wajib menurunkan rasio defisit di bawah ambang batas 3,0% PDB pada tahun fiskal berikutnya. Sebagai Menteri Keuangan, Saudara diminta menetapkan instrumen kebijakan fiskal yang akan dijalankan.",
    choices: [
      { lbl: "Pengurangan Belanja Operasional K/L (Cutting Expenditure)", hint: "−Kas kecil, +Pasar; resistensi politik dari kementerian", tone: "neutral", eff: { kas: 70, rakyat: -3, pasar: 3, presiden: -1 } },
      { lbl: "Penerbitan Surat Berharga Negara (SBN) Konvensional & Sukuk", hint: "+Kas, beban bunga naik; netral bagi rasio defisit", tone: "neutral", eff: { kas: 200, pasar: -2, ekonomi: -1 } },
      { lbl: "Realokasi Belanja Modal (Postponement Proyek Strategis)", hint: "Defisit turun cepat, −Ekonomi jangka menengah", tone: "neg", eff: { kas: 150, ekonomi: -4, rakyat: -2, pasar: 2 } },
      { lbl: "Pertahankan Defisit, Prioritaskan Pertumbuhan 5,3%", hint: "Defisit jenuh; risiko penurunan rating", tone: "neg", eff: { pasar: -5, presiden: -2, ekonomi: 3, rakyat: 1 } },
    ]},
  { year: 1, id: "y1q2", title: "Reformasi Subsidi Energi yang Membengkak",
    desc: "Realisasi pagu subsidi energi menembus Rp 304,7 Triliun, setara dengan 157% dari pagu awal Rp 134 Triliun, akibat kenaikan harga Indonesia Crude Price (ICP) rata-rata USD 92 per barel. Rasio subsidi energi terhadap total belanja negara mencapai 18,4%, menekan ruang fiskal untuk belanja pembangunan. Bauran kebijakan subsidi energi perlu direformasi agar lebih tepat sasaran dan efisien secara alokasi.",
    choices: [
      { lbl: "Reformasi Subsidi → Bantuan Langsung Tunai (BLT) Bertarget + Penyesuaian Harga Bertahap", hint: "+Kas, rawan sosial; +Inflasi transisi", tone: "neutral", eff: { kas: 110, rakyat: -6, pasar: 3, ekonomi: 2, inflasi: 4 } },

      { lbl: "Reformasi Struktural Jangka Panjang (Revisi UU Keuangan Negara)", hint: "+Integritas kelembagaan; lambat", tone: "pos", eff: { integritas: 3, pasar: 2, presiden: -1, kas: -10 } },
    ]},
  { year: 5, id: "y5q4", title: "Laporan Akuntabilitas Akhir kepada Presiden",
    desc: "Presiden meminta laporan akuntabilitas akhir periode lima tahun secara menyeluruh. Format dan substansi laporan akan menentukan warisan politik Menteri Keuangan serta posisi historis dalam historiografi pemerintahan. Pilihan format laporan memengaruhi persepsi publik dan kepercayaan institusional.",
    choices: [
      { lbl: "Laporan Jujur & Transparan (Akui Seluruh Tantangan)", hint: "+Integritas, +Rakyat; sedikit −Presiden", tone: "pos", eff: { integritas: 3, rakyat: 2, presiden: -1, pasar: 1 } },
      { lbl: "Laporan Positif (Fokus Capaian, Downplay Tantangan)", hint: "+Presiden; sedikit −Integritas", tone: "neutral", eff: { presiden: 3, integritas: -1, pasar: 0 } },
      { lbl: "Laporan Teknokratik (Data Kuantitatif + Proyeksi)", hint: "+Pasar, +Integritas; netral politik", tone: "pos", eff: { pasar: 2, integritas: 2, ekonomi: 1 } },
      { lbl: "Laporan Naratif Strategis (Warisan + Rekomendasi)", hint: "+Presiden, +Rakyat; konsultatif", tone: "neutral", eff: { presiden: 2, rakyat: 2, integritas: 1 } },
    ]},
];

/* ---------- STATE ---------- */
let state = null;
const Q_PER_YEAR = 4;

function defaultState() {
  return {
    kas: 500,
    ekonomi: 55,
    inflasi: 22,         // ≈ 3.7%
    rakyat: 50,
    presiden: 60,
    pasar: 55,
    integritas: 55,
    year: 1,
    qIdx: 0,             // index ke QUESTIONS array (global)
    answers: [],
    started: false,
    finished: false,
    endedReason: null,   // 'fired' / 'bankrupt' / 'crisis' / 'completed'
    yearLogs: [],       // log tiap tahun (target tercapai/tidak)
  };
}

function clamp(v, lo=0, hi=100) { return Math.max(lo, Math.min(hi, v)); }

function applyEffect(eff) {
  const deltas = [];
  for (const k in eff) {
    const v = eff[k];
    switch (k) {
      case "kas": state.kas += v; deltas.push({ key: "kas", v }); break;
      case "ekonomi": state.ekonomi = clamp(state.ekonomi + v); deltas.push({ key: "ekonomi", v }); break;
      case "inflasi": state.inflasi = clamp(state.inflasi + v); deltas.push({ key: "inflasi", v }); break;
      case "rakyat": state.rakyat = clamp(state.rakyat + v); deltas.push({ key: "rakyat", v }); break;
      case "presiden": state.presiden = clamp(state.presiden + v); deltas.push({ key: "presiden", v }); break;
      case "pasar": state.pasar = clamp(state.pasar + v); deltas.push({ key: "pasar", v }); break;
      case "integritas": state.integritas = clamp(state.integritas + v); deltas.push({ key: "integritas", v }); break;
    }
  }
  return deltas;
}

function statClass(key) {
  const v = state[key];
  if (key === "kas") return v < 100 ? "bad" : v > 500 ? "good" : "";
  if (key === "inflasi") return v > 36 ? "bad" : v < 18 ? "good" : "";
  if (v >= 65) return "good";
  if (v <= 25) return "bad";
  return "";
}

function fmtStat(key) {
  const m = STAT_META.find(s => s.key === key);
  return m.fmt(state[key]);
}

function checkTarget(t) {
  const v = state[t.key];
  if (t.op === ">=") return v >= t.req;
  if (t.op === "<=") return v <= t.req;
  return false;
}

/* ---------- IMMEDIATE FAIL CHECK ---------- */
function checkImmediateFail() {
  if (state.kas <= 0) {
    state.endedReason = "bankrupt";
    return true;
  }
  if (state.presiden <= 10) {
    state.endedReason = "fired";
    return true;
  }
  if (state.integritas <= 10) {
    state.endedReason = "kpk";
    return true;
  }
  return false;
}

/* ---------- RENDER ROUTER ---------- */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (!state || !state.started) {
    renderIntro(app);
  } else if (state.finished) {
    renderEnding(app);
  } else if (state.showYearReview) {
    renderYearReview(app);
  } else if (state.showYearIntro) {
    renderYearIntro(app);
  } else {
    renderQuestion(app);
  }
}

/* ---------- YEAR INTRO ---------- */

/* ---------- HUD ---------- */
function renderHUD(app) {
  const totalQ = YEARS.length * Q_PER_YEAR;
  const pct = (state.qIdx / totalQ) * 100;
  const y = YEARS[state.year - 1];
  const hud = document.createElement("div");
  hud.className = "hud";
  hud.innerHTML = `
    <div class="hud-top">
      <span class="hud-year">🗓️ Tahun ${state.year}/5</span>
      <span class="hud-q-count">Pertanyaan ${state.qIdx % Q_PER_YEAR + 1}/${Q_PER_YEAR} · Global ${state.qIdx + 1}/${totalQ}</span>
    </div>
    <div class="hud-progress"><div style="width:${pct}%"></div></div>
    <div class="hud-stats">
      ${STAT_META.map(s => `<div class="stat ${statClass(s.key)}" data-stat="${s.key}">
        <span class="lbl">${s.ico} ${s.lbl}</span>
        <span class="val">${fmtStat(s.key)}</span>
      </div>`).join("")}
    </div>
    <div class="targets-panel" style="margin-top:10px;">
      <div class="targets-title">🎯 Target Presiden Tahun ${state.year}</div>
      <div class="targets-grid">
        ${y.targets.map(t => {
          const met = checkTarget(t);
          return `<div class="target ${met ? 'met' : 'miss'}">
            <span class="t-lbl">${t.label}</span>
            <span class="t-row">
              <span class="t-current">${fmtStat(t.key)}</span>
              <span class="t-check">${met ? '✅' : '⬜'}</span>
            </span>
          </div>`;
        }).join("")}
      </div>

  `;
  app.appendChild(hud);
}

/* ---------- QUESTION ---------- */
function renderQuestion(app) {
  renderHUD(app);
  const q = QUESTIONS[state.qIdx];
  if (!q) { finishGame(); return; }
  const card = document.createElement("div");
  card.className = "q-card";
  card.innerHTML = `
    <div class="q-num">TAHUN ${q.year} · PERTANYAAN ${(state.qIdx % Q_PER_YEAR) + 1} dari ${Q_PER_YEAR}</div>
    <div class="q-tag">${YEARS[q.year-1].tagline}</div>
    <div class="q-title">${q.title}</div>
    <div class="q-desc">${q.desc}</div>
    <div class="choices">
      ${q.choices.map((c, i) => `<button class="choice" data-choice="${i}">
        <span class="lbl">${c.lbl}</span>
        <span class="hint">💡 ${c.hint}</span>
      </button>`).join("")}
    </div>
    <div id="feedback-zone"></div>
  `;
  app.appendChild(card);
  card.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => handleAnswer(parseInt(btn.dataset.choice)));
  });
}

/* ---------- HANDLE ANSWER (auto-advance) ---------- */
function handleAnswer(choiceIdx) {
  const q = QUESTIONS[state.qIdx];
  const c = q.choices[choiceIdx];
  document.querySelectorAll(".choice").forEach((b, i) => {
    b.disabled = true;
    if (i === choiceIdx) b.classList.add("picked-" + c.tone);
  });
  const deltas = applyEffect(c.eff);
  state.answers.push({ qId: q.id, year: q.year, choiceIdx, tone: c.tone, effects: c.eff });

  const fz = document.getElementById("feedback-zone");
  if (fz) {
    const fxList = deltas.length
      ? deltas.map(d => {
          const sign = d.v > 0 ? "+" : "";
          const cls = d.v > 0 ? "pos" : (d.v < 0 ? "neg" : "");
          const lbl = STAT_META.find(s => s.key === d.key);
          const valStr = d.key === "kas" ? sign + Math.round(d.v) + " T" : sign + Math.round(d.v);
          return `<span class="${cls}">${lbl.ico} ${lbl.lbl} ${valStr}</span>`;
        }).join(" · ")
      : "<span>Tidak ada perubahan</span>";
    const toneClass = c.tone === "pos" ? "pos" : c.tone === "neg" ? "neg" : "info";
    const toneLabel = c.tone === "pos" ? "✓ Keputusan Tegas" : c.tone === "neg" ? "⚠ Keputusan Berisiko" : "→ Keputusan Netral";
    fz.innerHTML = `<div class="feedback ${toneClass}">
      <b>${toneLabel}.</b> Efek: <span class="fx-list">${fxList}</span>
      <div class="next-hint">Melanjutkan ke pertanyaan berikutnya…</div>
    </div>`;
  }

  // flash stats
  deltas.forEach(d => {
    const el = document.querySelector(`[data-stat="${d.key}"]`);
    if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 600); }
  });
  // update HUD values & targets
  updateHUDLive();

  // auto-advance
  setTimeout(() => {
    state.qIdx += 1;
    // Check if year ended (4 questions done for this year)
    const questionsThisYearDone = (state.qIdx % Q_PER_YEAR) === 0;
    if (checkImmediateFail()) {
      state.finished = true;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (questionsThisYearDone) {
      // Year review next
      state.showYearReview = true;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }, 1200);
}

function updateHUDLive() {
  STAT_KEYS.forEach(k => {
    const el = document.querySelector(`[data-stat="${k}"] .val`);
    if (el) el.textContent = fmtStat(k);
    const parent = document.querySelector(`[data-stat="${k}"]`);
    if (parent) parent.className = "stat " + statClass(k);
  });
  // Update target checks
  const y = YEARS[state.year - 1];
  document.querySelectorAll(".targets-grid .target").forEach((el, i) => {
    const t = y.targets[i];
    if (!t) return;
    const met = checkTarget(t);
    el.className = "target " + (met ? "met" : "miss");
    const cur = el.querySelector(".t-current");
    if (cur) cur.textContent = fmtStat(t.key);
    const chk = el.querySelector(".t-check");
    if (chk) chk.textContent = met ? "✅" : "⬜";
  });
  // progress
  const totalQ = YEARS.length * Q_PER_YEAR;
  const bar = document.querySelector(".hud-progress > div");
  if (bar) bar.style.width = (((state.qIdx + 1) / totalQ) * 100) + "%";
}

/* ---------- YEAR REVIEW ---------- */
function renderYearReview(app) {
  const y = YEARS[state.year - 1];
  const results = y.targets.map(t => ({ t, met: checkTarget(t) }));
  const metCount = results.filter(r => r.met).length;
  const totalCount = results.length;
  const allMet = metCount === totalCount;
  const halfOrLess = metCount <= Math.floor(totalCount / 2);

  // President reaction
  let reaction;
  if (allMet) {
    reaction = "\"Kerja bagus. Semua target tahun ini tercapai. Saya mulai percaya Anda memang bisa diandalkan. Lanjutkan tahun depan.\"";
  } else if (halfOrLess) {
    reaction = "\"Hasil tahun ini mengecewakan. Banyak target miss. Saya mulai ragu dengan Anda. Tolong perbaiki tahun depan — ingat, saya bisa reshuffle kapan saja.\"";
  } else {
    reaction = "\"Cukup baik, sebagian target tercapai. Tahun depan harus lebih baik. Jangan lupakan target yang belum tercapai.\"";
  }

  // Log this year
  state.yearLogs.push({ year: state.year, results, metCount, totalCount });

  // Determine continue or end
  let shouldEnd = false;
  let endReason = null;
  if (allMet && state.presiden >= 55) {
    // bonus
    state.presiden = clamp(state.presiden + 3);
    // no end
  } else if (halfOrLess) {
    state.presiden = clamp(state.presiden - 6);
    if (state.presiden <= 10) { shouldEnd = true; endReason = "fired"; }
  }

  const div = document.createElement("div");
  div.className = "review";
  div.innerHTML = `
    <h1>📋 Evaluasi Akhir Tahun ${state.year}</h1>
    <div class="sub">Capaian target presiden — ${metCount}/${totalCount} tercapai</div>

    <div class="review-card">
      <h3>🎯 Target Presiden</h3>
      ${results.map(r => {
        const cls = r.met ? "met" : "miss";
        const badge = r.met ? "✓ Tercapai" : "✗ Miss";
        return `<div class="t-row">
          <span class="t-k">${r.t.label}</span>
          <span class="t-v">
            <span class="now ${cls}">${fmtStat(r.t.key)}</span>
            <span class="badge ${cls}">${badge}</span>
          </span>
        </div>`;
      }).join("")}
    </div>

    <div class="president-reaction">
      <div class="who">👔 REAKSI PRESIDEN</div>
      <div class="msg">${reaction}</div>
    </div>

    <div class="review-card">
      <h3>📊 Stat Saat Ini</h3>
      <div class="hud-stats" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:6px;">
        ${STAT_META.map(s => `<div class="stat ${statClass(s.key)}">
          <span class="lbl">${s.ico} ${s.lbl}</span>
          <span class="val">${fmtStat(s.key)}</span>
        </div>`).join("")}
      </div>
    </div>

    ${allMet ? '<div style="text-align:center; color:var(--green); font-size:13px; margin-bottom:14px;">🎁 Bonus: kepercayaan presiden +3 (semua target tercapai)</div>' : ''}
    ${halfOrLess ? '<div style="text-align:center; color:var(--red); font-size:13px; margin-bottom:14px;">⚠ Penalti: kepercayaan presiden −6 (sebagian besar target miss)</div>' : ''}
  `;
  app.appendChild(div);

  // Determine next
  const isLastYear = state.year >= YEARS.length;
  let btnLabel, btnHandler;
  if (shouldEnd) {
    state.endedReason = endReason;
    btnLabel = "Lihat Nasib Akhirmu →";
    btnHandler = () => { state.finished = true; state.showYearReview = false; render(); };
  } else if (isLastYear) {
    btnLabel = "Lihat Hasil Akhir Periode →";
    btnHandler = () => { state.finished = true; state.showYearReview = false; render(); };
  } else {
    btnLabel = `Lanjut ke Tahun ${state.year + 1} →`;
    btnHandler = () => {
      state.year += 1;
      state.showYearReview = false;
      state.showYearIntro = true;
      render();
    };
  }
  const btn = document.createElement("div");
  btn.className = "cta-center";
  btn.innerHTML = `<button class="cta" id="yr-next">${btnLabel}</button>`;
  app.appendChild(btn);
  btn.querySelector("#yr-next").addEventListener("click", btnHandler);
}

/* ---------- ENDING ---------- */
function renderEnding(app) {
  const survivedAll5 = state.year >= YEARS.length && state.endedReason === null && state.qIdx >= YEARS.length * Q_PER_YEAR;

  let verdict, verdictLabel, verdictClass, score = 0;

  // Score calculation
  if (state.kas > 600) score += 8;
  if (state.ekonomi >= 60) score += 8;
  if (state.inflasi <= 24) score += 8;
  if (state.rakyat >= 60) score += 8;
  if (state.presiden >= 60) score += 10;
  if (state.pasar >= 60) score += 8;
  if (state.integritas >= 60) score += 8;
  if (survivedAll5) score += 25;
  // Year bonus
  score += (state.yearLogs.length * 5);
  if (state.kas <= 0) score -= 15;
  if (state.integritas < 30) score -= 10;
  score = Math.max(0, Math.min(100, score));

  if (state.endedReason === "bankrupt") {
    verdict = "💀 Negara Bangkrut";
    verdictLabel = `Kas habis di tahun ${state.year}. Kamu dipecat sebelum periode selesai. Kegagalan total pengelolaan kas.`;
    verdictClass = "weak";
    score = Math.min(score, 20);
  } else if (state.endedReason === "fired") {
    verdict = "❌ Dipecat Presiden";
    verdictLabel = `Kepercayaan presiden habis di tahun ${state.year}. Reshuffle mendadak — kamu keluar sebelum periode 5 tahun selesai.`;
    verdictClass = "weak";
    score = Math.min(score, 25);
  } else if (state.endedReason === "kpk") {
    verdict = "🚔 Diusut KPK";
    verdictLabel = `Integritas anjlok di tahun ${state.year}. Skandal terbongkar, kamu jadi tersangka sebelum periode selesai.`;
    verdictClass = "weak";
    score = Math.min(score, 25);
  } else if (survivedAll5 && score >= 70) {
    verdict = "🏆 Menteri Keuangan Legendaris";
    verdictLabel = "Kamu bertahan 5 tahun penuh dan menyimpan warisan fiskal yang kuat. Presiden memuji, sejarah mencatat namamu dengan tinta emas.";
    verdictClass = "legendary";
  } else if (survivedAll5 && score >= 55) {
    verdict = "⭐ Menkeu Andalan Presiden";
    verdictLabel = "Lima tahun penuh berhasil diselesaikan. Presiden puas, banyak pihak minta arahan fiskalmu untuk periode berikutnya.";
    verdictClass = "strong";
  } else if (survivedAll5 && score >= 40) {
    verdict = "🙂 Bertahan, Biasa Saja";
    verdictLabel = "Kamu menyelesaikan periode 5 tahun. Tidak ada gembar-gembor, tapi juga tidak ada skandal besar. Penggantimu mengambil alih dengan tenang.";
    verdictClass = "decent";
  } else if (survivedAll5) {
    verdict = "😐 Selamat Kelar, Tapi Lupa";
    verdictLabel = "Kamu bertahan 5 tahun — tapi banyak target miss. Presiden tak lagi memuji, kamu dilupakan begitu saja.";
    verdictClass = "weak";
  } else {
    verdict = "📉 Periode Tidak Selesai";
    verdictLabel = `Kamu tidak bertahan sampai akhir tahun ke-5. Berhenti di tahun ${state.year}.`;
    verdictClass = "weak";
  }

  const tones = { pos: 0, neg: 0, neutral: 0 };
  state.answers.forEach(a => { tones[a.tone] = (tones[a.tone]||0) + 1; });

  const totalTargetsAllYears = state.yearLogs.reduce((s, yl) => s + yl.totalCount, 0);
  const totalMetAllYears = state.yearLogs.reduce((s, yl) => s + yl.metCount, 0);

  const div = document.createElement("div");
  div.className = "ending";
  div.innerHTML = `
    <h1>${survivedAll5 ? '🎉 Periode 5 Tahun Selesai' : '🔚 Akhir Masa Jabatan'}</h1>
    <div class="verdict-big ${verdictClass}">${verdict}</div>
    <div class="verdict-label">${verdictLabel}</div>

    <div class="score-row">
      <span class="score-num">${score}</span>
      <span class="score-max">/ 100</span>
    </div>

    <div class="final-stats">
      ${STAT_META.map(s => `<div class="stat ${statClass(s.key)}">
        <span class="lbl">${s.ico} ${s.lbl}</span>
        <span class="val">${fmtStat(s.key)}</span>
      </div>`).join("")}
    </div>

    <div class="summary">
      <h3>📊 Ringkasan Periode</h3>
      <div class="row"><span class="k">Tahun diselesaikan</span><span class="v ${state.year >= 5 ? 'pos' : 'neg'}">${state.yearLogs.length} / 5</span></div>
      <div class="row"><span class="k">Total target tercapai</span><span class="v ${totalMetAllYears >= Math.ceil(totalTargetsAllYears/2) ? 'pos' : 'neg'}">${totalMetAllYears} / ${totalTargetsAllYears}</span></div>
      <div class="row"><span class="k">Pertanyaan dijawab</span><span class="v">${state.answers.length} / ${YEARS.length * Q_PER_YEAR}</span></div>
      <div class="row"><span class="k">Keputusan tegas (positif)</span><span class="v pos">${tones.pos||0}</span></div>
      <div class="row"><span class="k">Keputusan berisiko (negatif)</span><span class="v neg">${tones.neg||0}</span></div>
      <div class="row"><span class="k">Keputusan kompromi (netral)</span><span class="v">${tones.neutral||0}</span></div>
    </div>

    <div class="summary">
      <h3>📅 Capaian per Tahun</h3>
      ${state.yearLogs.map(yl => {
        const cls = yl.metCount === yl.totalCount ? "pos" : (yl.metCount >= Math.ceil(yl.totalCount/2) ? "" : "neg");
        return `<div class="row"><span class="k">Tahun ${yl.year}</span><span class="v ${cls}">${yl.metCount}/${yl.totalCount} target</span></div>`;
      }).join("")}
      ${Array.from({length: 5 - state.yearLogs.length}, (_, i) => {
        const yr = state.yearLogs.length + i + 1;
        return `<div class="row"><span class="k">Tahun ${yr}</span><span class="v neg">— tidak diselesaikan —</span></div>`;
      }).join("")}
    </div>

    ${DISCLAIMER}

    <div class="cta-center">
      <button class="cta" id="restart-btn">🔄 Main Lagi</button>
    </div>
  `;
  app.appendChild(div);
  div.querySelector("#restart-btn").addEventListener("click", () => {
    state = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

/* ---------- INIT ---------- */
render();
</script>
</body>
</html>
